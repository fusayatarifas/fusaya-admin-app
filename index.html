<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a4c">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <title>FUSAYA Admin</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #102a4c; color: white; font: 1rem/1.5 system-ui; }
    main { width: min(28rem, 100%); padding: 2rem; }
    h1 { margin: .8rem 0; color: #f3ce66; font-size: 2.5rem; line-height: 1.05; }
    p { color: #dae3ed; }
    a, button { display: block; width: 100%; margin: .7rem 0; padding: .8rem 1rem; border-radius: .6rem; text-align: center; font: inherit; font-weight: 700; }
    a { background: #f3ce66; color: #13283d; text-decoration: none; }
    button { border: 1px solid #95a7bc; background: transparent; color: white; cursor: pointer; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" width="68" height="68" alt="">
    <h1>FUSAYA Admin</h1>
    <p>Centro administrativo FUSAYA MOTOS</p>
    <a href="https://script.google.com/macros/s/AKfycbySVKEV9v0jUR04OfkmzHX9dkNHvMMvGExC9E-1wODshGTAV45d6J0eip91NLJ0ntE_/exec">Abrir panel administrativo</a>
    <button id="install" type="button" hidden>Instalar en este dispositivo</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
