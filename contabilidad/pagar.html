<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a4c"><link rel="manifest" href="./manifest.webmanifest"><title>FUSAYA · Contabilidad</title><style>*{box-sizing:border-box}body{margin:auto;max-width:64rem;background:#f1f4f8;color:#102a4c;font:1rem/1.5 system-ui}header{background:#102a4c;color:white;padding:1.5rem;border-bottom:5px solid #d4ad37}main{padding:1rem}section,article{background:white;border-radius:12px;padding:1rem;margin:.75rem 0}button,input,select,a{font:inherit;padding:.6rem;margin:.25rem}button{cursor:pointer;background:#102a4c;color:white;border:0;border-radius:6px}img{max-width:100%}output{display:block;color:#702244}a{color:#173c73}</style><header>FUSAYA MOTOS</header><script src="./config.js"></script><script src="./conexion.js"></script><main><h1>Reportar pago</h1><form><label>Medio de pago <select id="medio"><option>TRANSFERENCIA</option><option>EFECTIVO</option></select></label><input id="foto" aria-label="Comprobante" type="file" accept="image/jpeg,image/png"><select id="rec" aria-label="Administrador que recibió" hidden></select><button id="send">Enviar reporte</button></form><output id="msg" role="status"></output></main><script>
const key=location.hash.slice(1),q=id=>document.getElementById(id);
q('medio').onchange=async()=>{let cash=q('medio').value==='EFECTIVO';q('foto').hidden=cash;q('rec').hidden=!cash;if(cash)try{const r=await request('receivers',{key});q('rec').replaceChildren(...r.map(a=>new Option(a.name,a.id)));}catch(e){q('msg').textContent=e.message;}};
document.querySelector('form').onsubmit=async e=>{e.preventDefault();q('send').disabled=true;try{const p={key,medio:q('medio').value,receptor:q('rec').value};if(p.medio==='TRANSFERENCIA'){const file=q('foto').files[0];if(!file)throw Error('Elige una imagen.');const bitmap=await createImageBitmap(file),scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);p.image=canvas.toDataURL('image/jpeg',0.88).split(',')[1];bitmap.close();}q('msg').textContent=await request('report',p);e.target.hidden=true;}catch(err){q('msg').textContent=err.message;}finally{q('send').disabled=false;}};</script></html>
