<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Ingreso a FUSAYA</title>
</head>
<body>
  <p id="mensaje" role="status">Validando el acceso seguro de FUSAYA…</p>
  <script>
    const consulta = new URLSearchParams(location.search);
    const codigo = consulta.get('code') || '';
    const estado = consulta.get('state') || '';
    const errorGoogle = consulta.has('error');
    history.replaceState(null, '', location.pathname);
    const mensaje = document.getElementById('mensaje');
    if (errorGoogle) {
      mensaje.textContent = 'Google no completó el ingreso. Regresa al panel e inténtalo de nuevo.';
    } else if (consulta.getAll('state').length !== 1 ||
               !/^[a-f0-9]{64}$/i.test(estado) ||
               consulta.getAll('code').length !== 1 ||
               !codigo || codigo.length > 4096) {
      mensaje.textContent = 'Abre FUSAYA Admin y toca Continuar con Google para iniciar sesión.';
    } else {
      const destino = new URL('https://script.google.com/macros/s/AKfycbySVKEV9v0jUR04OfkmzHX9dkNHvMMvGExC9E-1wODshGTAV45d6J0eip91NLJ0ntE_/exec');
      destino.searchParams.set('state', estado);
      destino.searchParams.set('code', codigo);
      location.replace(destino.href);
    }
  </script>
</body>
</html>
